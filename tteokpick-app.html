<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>떡픽 앱 · 나에게 맞는 떡볶이 밀키트</title>
<meta name="description" content="양념·맵기·떡·단맛·가격대를 고르면 떡볶이 밀키트 3개를 추천해 드려요. 전체 보기, 찜, 비교, 랜덤 뽑기까지.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #ffffff; --band: #fff4ec; --ink: #2a1a15; --muted: #6b544c; --line: #f3dccb;
  --chili: #e8452c; --chili-text: #c9341c; --chili-ink: #ffffff; --chili-soft: #ffe6d6;
  --heat-1: #ffd8b5; --heat-2: #fdb07e; --heat-3: #f47c4a; --heat-4: #e8452c; --heat-5: #8e1b1b;
  --card: #ffffff; --stripe: #fbe7da; --scrim: rgba(36, 26, 23, .55); --toast: #2a1a15;
  --display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --radius: 18px; --wrap: 1080px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171211; --band: #221815; --ink: #f8ece6; --muted: #c8b0a6; --line: #42302a;
    --chili: #ff6a4d; --chili-text: #ff8a70; --chili-ink: #1a0f0e; --chili-soft: #3d1f17;
    --heat-5: #c22626; --card: #1e1613; --stripe: #2a1d19; --scrim: rgba(0,0,0,.65); --toast: #f8ece6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171211; --band: #221815; --ink: #f8ece6; --muted: #c8b0a6; --line: #42302a;
  --chili: #ff6a4d; --chili-text: #ff8a70; --chili-ink: #1a0f0e; --chili-soft: #3d1f17;
  --heat-5: #c22626; --card: #1e1613; --stripe: #2a1d19; --scrim: rgba(0,0,0,.65); --toast: #f8ece6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere;
}
h1, h2, h3, p, ul, ol { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
:focus-visible { outline: 3px solid var(--chili); outline-offset: 2px; }

/* ===== 위 메뉴 ===== */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 60px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.logo { font-family: var(--display); font-size: 28px; color: var(--chili-text); line-height: 1; text-decoration: none; margin-right: auto; }
.logo small { font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.tabs { display: flex; gap: 6px; }
.tab { border: 2px solid var(--chili); color: var(--chili-text); background: var(--bg); border-radius: 999px; padding: 5px 14px; font-size: 15px; font-weight: 700; text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.tab[aria-current="page"] { background: var(--chili); color: var(--chili-ink); }
.tab .cnt { font-size: 13px; min-width: 20px; height: 20px; border-radius: 999px; display: inline-grid; place-items: center; padding: 0 5px; background: var(--chili-soft); color: var(--chili-text); }
.tab[aria-current="page"] .cnt { background: var(--chili-ink); color: var(--chili); }
@media (max-width: 640px) {
  .tabs { order: 3; width: 100%; }
  .tab { flex: 1; justify-content: center; padding: 5px 6px; font-size: 14px; }
}

/* ===== 공통 ===== */
main { padding-bottom: 120px; }
.view { padding-top: 20px; }
.head { display: grid; gap: 8px; margin-bottom: 18px; }
.eyebrow { justify-self: start; font-size: 14px; font-weight: 700; color: var(--chili-text); border: 2px solid var(--chili); border-radius: 999px; padding: 2px 12px; background: var(--bg); }
.title { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 6vw, 40px); line-height: 1.2; color: var(--chili); text-wrap: balance; }
.lead { color: var(--muted); font-size: 16px; }
.hero-band { background-image: repeating-linear-gradient(90deg, var(--stripe) 0 1px, transparent 1px 9px); border-bottom: 1px solid var(--line); padding: 20px 0 18px; }
.hero-band .head { margin-bottom: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; font-weight: 700; font-size: 17px; cursor: pointer; text-decoration: none; }
.btn-main { background: var(--chili); color: var(--chili-ink); box-shadow: 0 8px 20px -10px var(--chili); }
.btn-main.dim { opacity: .55; box-shadow: none; }
.btn-line { background: var(--bg); color: var(--ink); border: 2px solid var(--line); }
.btn-dark { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; }
.notice { background: var(--chili-soft); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 600; font-size: 15px; }
.notice.soft { background: var(--band); color: var(--muted); font-weight: 500; }
.note { color: var(--muted); font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== 선택 칩 ===== */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 15px; cursor: pointer; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--chili); border-color: var(--chili); color: var(--chili-ink); }
.chip:disabled { opacity: .4; cursor: default; }
.chip small { font-weight: 500; font-size: 13px; opacity: .85; }
.dot { display: inline-block; width: .75em; height: .75em; border-radius: 50%; background: var(--h); box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); flex: none; }

/* ===== 추천: 질문 ===== */
.qgrid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 861px) { .qgrid { grid-template-columns: 1fr 1fr; } .q.wide { grid-column: 1 / -1; } }
.q { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; align-content: start; transition: border-color .2s, box-shadow .2s; }
.q.missing { border-color: var(--chili); box-shadow: 0 0 0 4px var(--chili-soft); }
.q h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
.q h2 .num { width: 28px; height: 28px; border-radius: 50%; background: var(--chili-soft); color: var(--chili-text); display: inline-grid; place-items: center; font-family: var(--display); font-size: 16px; font-weight: 400; flex: none; }
.q .help { color: var(--muted); font-size: 14px; margin-top: -4px; }
.spice-row { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; }
.fire { width: 76px; text-align: center; display: grid; justify-items: center; gap: 2px; }
.fire svg { width: 64px; height: 64px; color: var(--chili-text); }
.fire .say { font-size: 12.5px; font-weight: 700; color: var(--chili-text); line-height: 1.3; }
.fire.pop svg { animation: pop .3s ease; }
.fire .face { fill: var(--chili-soft); }
.fire .face-line { fill: none; stroke: var(--chili-soft); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.fire .blush { fill: #ff9e9e; opacity: .85; }
.fire .drop { fill: #7cc4f0; }
.fire.none svg { color: var(--line); }
.fire.none .face { fill: var(--muted); }
.fire.none .face-line { stroke: var(--muted); }
.actions { position: sticky; bottom: 0; z-index: 10; margin-top: 16px; padding: 10px 0 calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); box-shadow: 0 -10px 16px -10px rgba(42,26,21,.12); display: grid; gap: 6px; }
.actions .row { display: flex; gap: 10px; align-items: center; }
.actions .btn-main { flex: 1; min-height: 56px; font-size: 19px; }
.missing-msg { font-size: 15px; font-weight: 700; color: var(--chili-text); }
.missing-msg:empty { display: none; }
#goBtn { line-height: 1.25; text-align: center; }
#goBtn.dim { font-size: 16px; padding: 0 16px; }
#goBtn .prog { font-family: var(--display); font-weight: 400; font-size: 19px; margin-right: 2px; }
.missing-msg.flash { animation: flash .6s ease; }

/* ===== 추천 결과 ===== */
.title-badge { background: var(--card); border: 2px dashed var(--chili); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 2px; text-align: center; }
.title-badge .you { font-size: 14px; color: var(--muted); font-weight: 600; }
.title-badge strong { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 34px); color: var(--chili); line-height: 1.25; }
.title-badge .fun { font-size: 12.5px; color: var(--muted); }
.picked { display: flex; flex-wrap: wrap; gap: 6px; }
.picked span { font-size: 14px; font-weight: 700; background: var(--chili-soft); border-radius: 999px; padding: 3px 12px; }
.share { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.share-box { width: 100%; display: grid; gap: 6px; }
.share-box textarea { width: 100%; font: 14px/1.4 ui-monospace, Menlo, monospace; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--band); color: var(--ink); resize: none; }
.stack { display: grid; gap: 14px; }

/* ===== 카드 ===== */
.klist { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.klist.one { grid-template-columns: 1fr; max-width: 720px; }
.kcard { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.kcard.best { border-color: var(--chili); }
.kcard.cmp-on { border-color: var(--chili); box-shadow: 0 0 0 3px var(--chili-soft); }
.khead { display: flex; align-items: flex-start; gap: 10px; }
.rank { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--chili); color: var(--chili-ink); display: grid; place-items: center; font-family: var(--display); font-size: 17px; }
.khead h3 { flex: 1; font-size: 17px; line-height: 1.4; min-width: 0; padding-top: 3px; }
.heart { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--chili-soft); color: var(--chili); font-size: 22px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.heart[aria-pressed="true"] { background: var(--chili); color: var(--chili-ink); }
.heart.pop { animation: pop .4s ease; }
.crumb { position: absolute; left: 50%; top: 40%; width: 10px; height: 6px; border-radius: 3px; background: #f6e3cf; box-shadow: 0 0 0 1.5px var(--chili); pointer-events: none; animation: fly .6s ease-out forwards; }
.crumb.b { animation-name: fly2; }
.tags { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tags li { font-size: 13.5px; font-weight: 600; padding: 2px 10px; border-radius: 12px; background: var(--band); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 5px; }
.why { font-size: 15px; }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: 15px; }
.meta b { font-size: 18px; font-variant-numeric: tabular-nums; }
.meta .sub { color: var(--muted); font-size: 13.5px; }
.warn { background: var(--chili-soft); border-radius: 10px; padding: 6px 12px; font-weight: 600; font-size: 14px; }
.kbtns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cmpb { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; cursor: pointer; min-height: 40px; }
.cmpb[aria-pressed="true"] { border-color: var(--chili); background: var(--chili-soft); color: var(--chili-text); }
.shop { margin-left: auto; min-height: 40px; padding: 0 16px; font-size: 14px; }
.alt { font-size: 13.5px; color: var(--muted); }

/* ===== 전체 밀키트 ===== */
.fbox { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); }
.fbox > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-weight: 700; font-size: 16px; min-height: 52px; }
.fbox > summary::-webkit-details-marker { display: none; }
.fbox > summary .arrow { width: 22px; height: 22px; border-radius: 50%; background: var(--chili-soft); color: var(--chili-text); display: inline-grid; place-items: center; font-size: 12px; transition: transform .2s; flex: none; }
.fbox[open] > summary .arrow { transform: rotate(180deg); }
.fbox > summary .picked-sum { font-weight: 600; font-size: 14px; color: var(--chili-text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbox > summary .picked-sum.none { color: var(--muted); }
.fbox[open] > summary { border-bottom: 1px solid var(--line); }
.filters { padding: 12px 14px 14px; display: grid; gap: 10px; }
.frow { display: grid; grid-template-columns: 58px 1fr; gap: 8px; align-items: start; }
.frow > span { font-size: 14px; font-weight: 700; color: var(--muted); padding-top: 8px; }
.filters .chip { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px 0; }
.toolbar .count { font-weight: 700; font-size: 17px; }
.toolbar .sorts { display: flex; gap: 6px; flex-wrap: wrap; }
.toolbar .sorts .chip { min-height: 34px; padding: 3px 11px; font-size: 13.5px; }
.toolbar .right { margin-left: auto; display: flex; gap: 8px; }
.dice { background: var(--chili-soft); color: var(--chili-text); border: 0; }
.dice.busy { opacity: .7; }

/* ===== 빈 화면 ===== */
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 34px 16px; background: var(--card); border: 2px dashed var(--line); border-radius: var(--radius); }
.empty svg { width: 84px; height: 84px; color: var(--chili-text); }
.empty .face { fill: var(--chili-soft); }
.empty .face-line { fill: none; stroke: var(--chili-soft); stroke-width: 2.4; stroke-linecap: round; }
.empty p { color: var(--muted); max-width: 26em; }

/* ===== 비교 ===== */
.cbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 25; width: min(560px, calc(100% - 24px)); background: var(--ink); color: var(--bg); border-radius: 18px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); }
.cbar .txt { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.35; }
.cbar .txt b { font-size: 15.5px; }
.cbar .names { display: block; color: color-mix(in srgb, var(--bg) 70%, transparent); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbar button { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
.cbar .clear { background: transparent; color: var(--bg); border: 1.5px solid color-mix(in srgb, var(--bg) 40%, transparent); }
.cbar .go { background: var(--chili); color: var(--chili-ink); }
.ctable-wrap { overflow-x: auto; border-radius: var(--radius); border: 2px solid var(--line); background: var(--card); }
.ctable { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 320px; }
.ctable th, .ctable td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.ctable thead th { background: var(--chili-soft); font-size: 15px; line-height: 1.35; }
.ctable tbody th { color: var(--muted); width: 78px; white-space: nowrap; font-size: 14px; }
.ctable tr:last-child > * { border-bottom: 0; }
.ctable .same { color: var(--muted); }
.ctable .rm { margin-top: 6px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }

/* ===== 뽑기 창 ===== */
.modal { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.mbox { width: min(440px, 100%); max-height: 100%; overflow: auto; background: var(--bg); border-radius: 22px; padding: 20px; display: grid; gap: 12px; box-shadow: 0 20px 40px -10px rgba(0,0,0,.4); }
.mtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mtop b { color: var(--chili-text); }
.pot { display: grid; justify-items: center; gap: 6px; padding: 18px 0 8px; }
.pot svg { width: 120px; height: 100px; }
.pot.shake svg { animation: shake .6s ease-in-out; }
.pot .steam { animation: steam .6s ease-in-out infinite; transform-origin: center bottom; }
.pot p { font-weight: 700; color: var(--chili-text); }
.mresult.boing { animation: boing .3s ease-out; }

/* ===== 알림 ===== */
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; background: var(--toast); color: var(--bg); border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: 15px; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 24px -10px rgba(0,0,0,.4); }
.toast.show { animation: toastin .2s ease-out; }

@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.28); } 100% { transform: scale(1); } }
@keyframes fly { 0% { opacity: 1; transform: translate(-50%, 0) rotate(0); } 100% { opacity: 0; transform: translate(-130%, -34px) rotate(-40deg); } }
@keyframes fly2 { 0% { opacity: 1; transform: translate(-50%, 0) rotate(0); } 100% { opacity: 0; transform: translate(40%, -38px) rotate(35deg); } }
@keyframes shake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(7deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
@keyframes steam { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
@keyframes boing { 0% { transform: scale(.85); opacity: 0; } 70% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
@keyframes flash { 0%, 100% { opacity: 1; } 30% { opacity: .3; } 60% { opacity: 1; } }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .crumb { display: none; }
}
@media (max-width: 480px) {
  .klist { grid-template-columns: 1fr; }
  .shop { margin-left: 0; flex: 1; }
  .frow { grid-template-columns: 1fr; gap: 4px; }
  .frow > span { padding-top: 0; }
}
</style>
</head>
<body>
<noscript>
  <div style="background:#ffe6d6;color:#2a1a15;padding:14px 16px;font-weight:700;text-align:center">추천을 받으려면 브라우저에서 자바스크립트를 켜 주세요.</div>
  <div style="max-width:640px;margin:24px auto;padding:0 16px;font-family:sans-serif;line-height:1.6">
    <h1 style="color:#e8452c">떡픽</h1>
    <p>양념·맵기·떡·단맛·가격대를 고르면 나에게 맞는 떡볶이 밀키트 3개를 추천해 드려요. 전체 밀키트 보기, 찜, 비교, 랜덤 뽑기도 할 수 있어요.</p>
  </div>
</noscript>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#recommend" aria-label="떡픽 앱, 추천 화면으로">떡픽<small>앱</small></a>
    <nav class="tabs" aria-label="메뉴">
      <a class="tab" href="#recommend" data-tab="recommend">추천받기</a>
      <a class="tab" href="#all" data-tab="all">전체 밀키트</a>
      <a class="tab" href="#wish" data-tab="wish">♥ 찜 <span class="cnt" id="wishCount">0</span></a>
    </nav>
  </div>
</header>

<main id="app" tabindex="-1"></main>

/* =========================================================
   4. 저장 (localStorage) · 막혀도 멈추지 않게
   ========================================================= */
const WISH_KEY = 'tteokpick.wish.v1';
const store = { ok: true, broke: false, removed: 0 };
let wish = [];
const loadWish = () => {
  let raw = null;
  try { raw = window.localStorage.getItem(WISH_KEY); store.ok = true; }
  catch (_) { store.ok = false; return; }
  if (raw == null) { wish = []; return; }
  let arr;
  try { arr = JSON.parse(raw); } catch (_) { arr = null; }
  if (!Array.isArray(arr) || arr.some(x => typeof x !== 'string')) {
    wish = []; store.broke = true; saveWish(); return;
  }
  const uniq = [...new Set(arr)];
  const keep = uniq.filter(id => BY_ID[id]);
  store.removed += uniq.length - keep.length;
  wish = keep;
  if (keep.length !== arr.length) saveWish();
};
const saveWish = () => {
  if (!store.ok) return;
  try { window.localStorage.setItem(WISH_KEY, JSON.stringify(wish)); }
  catch (_) { store.ok = false; }
};
const isWished = id => wish.includes(id);

/* =========================================================

const answers = { s: null, h: null, t: null, w: null, p: null };
const filters = { s: 'all', h: 'all', t: 'all', p: 'all' };
let sortKey = 'reviews';
let compare = [];          /* 비교에 담은 id (저장하지 않음) */
let lastPick = null;       /* 랜덤 뽑기: 방금 나온 id */
let bannerMsg = '';        /* 다음 화면에 한 번 보여 줄 안내 */
let filtersOpen = null;    /* 거르기 펼침: 처음엔 휴대폰 접힘 · PC 펼침, 이후 사용자가 고른 대로 */

/* =========================================================
   6. 알림 (겹치지 않게 마지막 것 하나만)

const toastEl = document.getElementById('toast');

const toast = msg => {
  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 1500);
};

/* =========================================================
   7. 화면 바꾸기 (주소 끝 #…)
   ========================================================= */
const app = document.getElementById('app');
let navHash = location.hash || '';
const parseHash = () => {
  const h = (navHash || '').replace(/^#/, '');
  const [name, qs = ''] = h.split('?');
  const params = {};
  qs.split('&').filter(Boolean).forEach(p => { const [k, v = ''] = p.split('='); try { params[decodeURIComponent(k)] = decodeURIComponent(v); } catch (_) { params[k] = v; } });
  return { name: name || 'recommend', params };
};
let current = '';
const go = hash => {
  navHash = hash;
  if (location.hash !== hash) { try { location.hash = hash; } catch (_) {} }
  route();
};
const replaceHash = hash => {
  navHash = hash;
  try { history.replaceState(null, '', location.pathname + location.search + hash); } catch (_) {}
};
const route = () => {
  const { name, params } = parseHash();
  closeModal(true);
  let view = name;
  if (view === 'result') {
    const a = readResultParams(params);
    if (!a) { bannerMsg = '링크 정보가 올바르지 않아서 처음부터 골라 주세요.'; resetAnswers(); view = 'recommend'; replaceHash('#recommend'); renderRecommend(); }
    else { Object.assign(answers, a); renderResult(a); }
  } else if (view === 'all') renderAll();
  else if (view === 'wish') renderWish();
  else if (view === 'compare') renderCompare(params);
  else { view = 'recommend'; renderRecommend(); }
  setTab(view === 'result' ? 'recommend' : view === 'compare' ? '' : view);
  if (current !== navHash) { window.scrollTo({ top: 0, behavior: 'instant' }); current = navHash; }
  renderCbar();
};
const setTab = key => {
  document.querySelectorAll('.tab').forEach(t => { if (t.dataset.tab === key) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  const titles = { recommend: '추천받기', all: '전체 밀키트', wish: '찜', '': '비교하기' };
  document.title = `${titles[key] ?? '떡픽'} · 떡픽 앱`;
};
const resetAnswers = () => { Object.keys(answers).forEach(k => { answers[k] = null; }); };

/* 공유 링크 읽기 · 만들기 */
const readResultParams = p => {
  const s = p.s, h = Number(p.h), t = p.t, w = Number(p.w);
  const pr = p.p === 'any' ? 'any' : Number(p.p);
  const okS = SAUCE_ORDER.includes(s), okH = [1, 2, 3, 4, 5].includes(h), okT = t === 'rice' || t === 'wheat';
  const okW = [1, 2, 3].includes(w), okP = pr === 'any' || [1, 2, 3, 4].includes(pr);
  return okS && okH && okT && okW && okP ? { s, h, t, w, p: pr } : null;
};
const resultHash = a => `#result?s=${a.s}&h=${a.h}&t=${a.t}&w=${a.w}&p=${a.p}`;
const pageBase = () => location.href.split('#')[0];

/* =========================================================

const cardHTML = (k, opt = {}) => {
  const w = isWished(k.id), c = compare.includes(k.id);
  return `<li class="kcard${opt.best ? ' best' : ''}${c ? ' cmp-on' : ''}" data-id="${k.id}">
    <div class="khead">${opt.rank ? `<span class="rank" aria-hidden="true">${opt.rank}</span>` : ''}
      <h3>${opt.rank ? `<span class="sr">${opt.rank}위 </span>` : ''}${esc(k.name)}</h3>
      <button class="heart" type="button" data-act="wish" aria-pressed="${w}" aria-label="${esc(k.name)} 찜하기">${w ? '♥' : '♡'}</button></div>
    <ul class="tags"><li>${SAUCE[k.sauce]}</li><li><i class="dot" style="--h:var(--heat-${k.spicy})" aria-hidden="true"></i>맵기 ${k.spicy}단계 · ${SPICY[k.spicy]}</li><li>${TTEOK_TAG[k.tteok]}</li></ul>
    ${opt.why ? `<p class="why">${esc(opt.why)}</p>` : ''}
    <div class="meta"><span>가격 <b>${won(k.price)}</b></span><span class="sub">1팩 · ${esc(k.shop)} · 단맛 ${k.sweet == null ? '정보 없음' : SWEET_SHORT[k.sweet]} · 후기 ${k.reviews.toLocaleString('ko-KR')}</span></div>

};
const emptyHTML = (msg, btnLabel, hash) => `<div class="empty">${BOWL_SVG}<p>${esc(msg)}</p>${btnLabel ? `<a class="btn btn-main" href="${hash}">${esc(btnLabel)}</a>` : ''}</div>`;

const missingKeys = () => QUESTIONS.filter(q => answers[q.key] == null);
const updateGo = () => {
  const miss = missingKeys();
  const btn = document.getElementById('goBtn'); if (!btn) return;
  const done = QUESTIONS.length - miss.length;
  btn.classList.toggle('dim', miss.length > 0);
  btn.setAttribute('aria-disabled', miss.length > 0 ? 'true' : 'false');
  btn.innerHTML = miss.length
    ? `<span><span class="prog">${done} / ${QUESTIONS.length}</span> 골랐어요 · ${miss.length}개 더 고르면 추천받기</span>`
    : `추천 보기 ${ARROW}`;
  const m = document.getElementById('missingMsg');
  if (!miss.length) m.textContent = '';
  document.querySelectorAll('.q').forEach(el => { if (answers[el.dataset.q] != null) el.classList.remove('missing'); });
};
const updateFire = animate => {
  const el = document.getElementById('fire'); if (!el) return;
  const lv = answers.h || 0;
  el.className = 'fire' + (lv ? '' : ' none');
  el.innerHTML = fireSVG(lv) + `<span class="say">${SAY[lv]}</span>`;
  if (animate && !reduceMotion()) { el.classList.add('pop'); }
};
const onGo = () => {
  const miss = missingKeys();

};

const copyLink = () => {
  const base = pageBase();
  const url = base + resultHash(answers);

    const area = document.getElementById('shareArea');
    if (!area.querySelector('.share-box')) area.insertAdjacentHTML('beforeend', `<div class="share-box"><p class="notice soft">미리보기 화면에서는 공유 링크를 만들 수 없어요. 파일을 내려받아 GitHub Pages에 올리면 링크를 쓸 수 있어요.</p></div>`);

  const done = proto === 'file:' ? '링크를 복사했어요! (내 컴퓨터 파일 주소라 다른 사람은 열 수 없어요)' : '링크를 복사했어요!';

    }
    const ta = document.getElementById('shareText'); ta.value = url; ta.focus(); ta.select();

/* =========================================================
   11. 전체 밀키트 · 거르기 · 정렬
   ========================================================= */
const tteokOk = (k, t) => t === 'all' ? true : (k.tteok === t || k.tteok === 'both');
const match = (k, f, skip) =>
  (skip === 's' || f.s === 'all' || k.sauce === f.s) &&
  (skip === 'h' || f.h === 'all' || k.spicy === f.h) &&
  (skip === 't' || tteokOk(k, f.t)) &&
  (skip === 'p' || f.p === 'all' || bandOf(k.price) === f.p - 1);
const byName = (x, y) => x.name.localeCompare(y.name, 'ko');
const SORTS = {
  reviews: { label: '후기 많은 순', fn: (x, y) => y.reviews - x.reviews || x.price - y.price || byName(x, y) },
  price: { label: '가격 낮은 순', fn: (x, y) => x.price - y.price || y.reviews - x.reviews || byName(x, y) },
  mild: { label: '덜 매운 순', fn: (x, y) => x.spicy - y.spicy || y.reviews - x.reviews || byName(x, y) },
};
const filtered = () => KITS.filter(k => match(k, filters)).sort(SORTS[sortKey].fn);

      ${row('h', '맵기', [{ v: 'all', t: '전체' }].concat([1, 2, 3, 4, 5].map(v => { const n = spiceCount(v); return { v, t: `<i class="dot" style="--h:var(--heat-${v})" aria-hidden="true"></i>${v} <small>(${n})</small>`, dis: n === 0 && filters.h !== v }; })))}
      ${row('t', '떡', [{ v: 'all', t: '전체' }, { v: 'rice', t: '쌀떡' }, { v: 'wheat', t: '밀떡' }])}
      ${row('p', '가격대', [{ v: 'all', t: '전체' }].concat(BANDS.map((b, i) => ({ v: i + 1, t: b.label }))))}
    </div>
    </details>
    <div class="toolbar">
      <span class="count" aria-live="polite">${list.length}개</span>
      <div class="sorts" role="group" aria-label="정렬">${Object.entries(SORTS).map(([k, s]) => `<button class="chip" type="button" data-sort="${k}" aria-pressed="${sortKey === k}">${s.label}</button>`).join('')}</div>
      <div class="right">
        ${isDefault ? '' : '<button class="btn btn-line" type="button" id="resetF" style="min-height:40px;padding:0 14px;font-size:14px">처음으로</button>'}

      </div>

    ${hiddenUnknown ? '<p class="notice soft" style="margin-bottom:12px">떡 종류를 확인하지 못한 4개는 빠졌어요. \'전체\'를 고르면 볼 수 있어요.</p>' : ''}
    ${list.length ? `<ul class="klist">${list.map(k => cardHTML(k)).join('')}</ul><p class="note" style="margin-top:14px">${PRICE_NOTE}</p>`
      : emptyHTML('이 조건에 맞는 밀키트가 없어요. 조건을 하나 바꿔 볼까요?', '처음으로', '#all-reset')}
  </div>`;
};

/* =========================================================
   12. 랜덤 뽑기 (보글보글 냄비)
   ========================================================= */
const modal = document.getElementById('modal');
let drawing = false, drawTimer = 0, modalOpener = null;
const draw = () => {
  if (drawing) return;
  const list = filtered(); if (!list.length) return;
  let pool = list.length > 1 ? list.filter(k => k.id !== lastPick) : list;
  const k = pool[Math.floor(Math.random() * pool.length)];
  lastPick = k.id;
  const label = filters.s === 'all' && filters.h === 'all' && filters.t === 'all' && filters.p === 'all' ? `전체 ${list.length}개` : `거른 ${list.length}개`;
  if (modal.hidden) { modalOpener = document.activeElement; }
  modal.hidden = false;
  const show = () => {
    drawing = false;
    modal.innerHTML = `<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt">
      <div class="mtop"><b id="mt">🎲 ${label} 중에서 골랐어요</b><button class="btn btn-line" type="button" data-act="close" style="min-height:36px;padding:0 12px;font-size:14px">닫기</button></div>
      ${list.length === 1 ? '<p class="notice soft">조건에 맞는 밀키트가 1개예요.</p>' : ''}
      <ul class="klist one mresult${reduceMotion() ? '' : ' boing'}">${cardHTML(k)}</ul>
      <button class="btn btn-main" type="button" data-act="redraw">다시 뽑기</button>
    </div>`;
    const r = modal.querySelector('[data-act="redraw"]'); if (r) r.focus();
  };
  if (reduceMotion()) { show(); return; }
  drawing = true;
  const dice = document.getElementById('diceBtn'); if (dice) { dice.textContent = '보글보글…'; dice.classList.add('busy'); }
  modal.innerHTML = `<div class="mbox" role="dialog" aria-modal="true" aria-label="뽑는 중"><div class="pot shake">${POT_SVG}<p>보글보글…</p></div><button class="btn btn-main" type="button" disabled>보글보글…</button></div>`;
  clearTimeout(drawTimer);
  drawTimer = setTimeout(() => { if (dice) { dice.textContent = '🎲 오늘 뭐 먹지?'; dice.classList.remove('busy'); } show(); }, 900);
};
const closeModal = silent => {
  if (modal.hidden) return;
  clearTimeout(drawTimer); drawing = false;
  modal.hidden = true; modal.innerHTML = '';
  const dice = document.getElementById('diceBtn'); if (dice) { dice.textContent = '🎲 오늘 뭐 먹지?'; dice.classList.remove('busy'); }
  if (!silent && modalOpener && document.contains(modalOpener)) modalOpener.focus();
};

/* =========================================================
   13. 찜 목록
   ========================================================= */
const renderWish = () => {
  const notes = [];
  if (store.broke) { notes.push('찜 정보를 불러오지 못해서 비웠어요. 다시 찜해 주세요.'); store.broke = false; }
  if (store.removed) { notes.push(`판매가 끝난 밀키트 ${store.removed}개를 찜에서 뺐어요.`); store.removed = 0; }
  const list = wish.map(id => BY_ID[id]).filter(Boolean);
  app.innerHTML = `
  <section class="hero-band"><div class="wrap head">
    <span class="eyebrow">찜</span>
    <h1 class="title">찜한 밀키트 ${list.length}개</h1>
  </div></section>
  <div class="wrap view stack">
    <p class="notice soft">${store.ok ? '♥ 찜은 이 기기, 이 브라우저에만 저장돼요. ♥를 다시 누르면 찜에서 빠져요.' : '이 브라우저에서는 찜이 저장되지 않아요. 창을 닫으면 사라져요.'}</p>
    ${notes.map(n => `<p class="notice">${esc(n)}</p>`).join('')}
    ${list.length ? `<ul class="klist">${list.map(k => cardHTML(k)).join('')}</ul><p class="note">${PRICE_NOTE}</p>`
      : emptyHTML('아직 찜한 떡볶이가 없어요. 마음에 드는 밀키트의 ♡를 눌러 보세요.', '전체 밀키트 보기', '#all')}
  </div>`;
};
const updateWishCount = () => { document.getElementById('wishCount').textContent = wish.length; };
const toggleWish = (id, btn) => {
  const on = !isWished(id);
  wish = on ? [id].concat(wish.filter(x => x !== id)) : wish.filter(x => x !== id);
  saveWish(); updateWishCount();
  toast(on ? (store.ok ? '찜했어요 ♥' : '찜했어요 ♥ (창을 닫으면 사라져요)') : '찜에서 뺐어요');
  document.querySelectorAll(`.kcard[data-id="${id}"] .heart`).forEach(h => { h.setAttribute('aria-pressed', on); h.textContent = on ? '♥' : '♡'; });
  if (btn && !reduceMotion()) {
    const h = btn;
    h.classList.remove('pop'); void h.offsetWidth; h.classList.add('pop');
    if (on) ['a', 'b'].forEach(c => { const s = document.createElement('span'); s.className = 'crumb ' + c; h.appendChild(s); setTimeout(() => s.remove(), 650); });
  }
  if (parseHash().name === 'wish' && !on) {
    const card = btn && btn.closest('.kcard');
    renderWish();
    if (card) { const n = app.querySelector('.kcard .heart'); if (n) n.focus({ preventScroll: true }); }
  }
};

/* =========================================================
   14. 비교하기
   ========================================================= */
const cbar = document.getElementById('cbar');
const renderCbar = () => {
  const nm = parseHash().name;
  if (!compare.length || nm === 'compare' || nm === 'recommend' || !['all', 'wish', 'result'].includes(nm)) { cbar.hidden = true; return; }
  const names = compare.map(id => BY_ID[id].name).join(' · ');
  cbar.hidden = false;
  cbar.innerHTML = `<div class="txt"><b>비교할 밀키트 ${compare.length} / 2</b>${compare.length < 2 ? ' · 하나 더 골라 주세요' : ''}<span class="names">${esc(names)}</span></div>
    <button class="clear" type="button" data-act="clear">비우기</button>
    ${compare.length === 2 ? `<button class="go" type="button" data-act="compare">비교하기</button>` : ''}`;
};
const toggleCompare = id => {
  if (compare.includes(id)) compare = compare.filter(x => x !== id);
  else if (compare.length >= 2) { toast('2개까지 고를 수 있어요. 하나를 빼고 다시 골라 주세요'); return; }
  else compare = compare.concat(id);
  refreshCompareUI();
};
const refreshCompareUI = () => {
  document.querySelectorAll('.kcard').forEach(c => {
    const on = compare.includes(c.dataset.id); c.classList.toggle('cmp-on', on);
    const b = c.querySelector('.cmpb'); if (b) { b.setAttribute('aria-pressed', on); b.textContent = on ? '✓ 비교 담음' : '+ 비교'; }
  });
  renderCbar();
};
const renderCompare = p => {
  const a = BY_ID[p.a], b = BY_ID[p.b];
  const head = `<section class="hero-band"><div class="wrap head"><span class="eyebrow">비교하기</span><h1 class="title">두 밀키트 비교</h1></div></section>`;
  if (a && b && a.id === b.id) { app.innerHTML = head + `<div class="wrap view">${emptyHTML('서로 다른 밀키트 2개를 골라 주세요.', '전체 밀키트 보기', '#all')}</div>`; return; }
  if (!a || !b) { app.innerHTML = head + `<div class="wrap view">${emptyHTML('비교할 밀키트를 찾지 못했어요.', '전체 밀키트 보기', '#all')}</div>`; return; }
  compare = [a.id, b.id];
  const rows = [
    ['양념', k => SAUCE[k.sauce]],
    ['맵기', k => `${k.spicy}단계 · ${SPICY[k.spicy]}`],
    ['떡', k => TTEOK_TAG[k.tteok]],
    ['단맛', k => k.sweet == null ? '정보 없음' : SWEET_TXT[k.sweet]],
    ['가격 (1팩)', k => won(k.price)],
    ['판매처', k => k.shop],
    ['후기 수', k => k.reviews.toLocaleString('ko-KR')],
    ['비고', k => k.note || '-'],
  ];
  app.innerHTML = head + `<div class="wrap view stack">
    <div class="ctable-wrap"><table class="ctable">
      <thead><tr><th scope="col"><span class="sr">항목</span></th>${[a, b].map(k => `<th scope="col">${esc(k.name)}<br><button class="rm" type="button" data-act="rm" data-id="${k.id}">빼기</button></th>`).join('')}</tr></thead>
      <tbody>${rows.map(([l, f]) => { const x = f(a), y = f(b); return `<tr><th scope="row">${l}</th><td class="${x === y ? 'same' : ''}">${esc(x)}</td><td class="${x === y ? 'same' : ''}">${esc(y)}</td></tr>`; }).join('')}
      <tr><th scope="row"><span class="sr">쇼핑몰</span></th>${[a, b].map(k => `<td><a class="btn btn-dark" style="min-height:38px;padding:0 12px;font-size:13.5px" href="${esc(k.url)}" target="_blank" rel="noopener">${esc(k.shop)}에서 보기 ${OUT}</a></td>`).join('')}</tr>
      <tr><th scope="row"><span class="sr">찜</span></th>${[a, b].map(k => `<td><button class="cmpb" type="button" data-act="wish-plain" data-id="${k.id}" aria-pressed="${isWished(k.id)}">${isWished(k.id) ? '♥ 찜함' : '♡ 찜하기'}</button></td>`).join('')}</tr>
      </tbody></table></div>
    <p class="note">회색 글씨는 두 밀키트가 같은 항목이에요. ${PRICE_NOTE}</p>
    <a class="btn btn-line" href="#all">다른 밀키트 고르기</a>
  </div>`;
};

/* =========================================================
   15. 버튼 처리 (양식 제출 없이 클릭으로 바로)
   ========================================================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t) { if (e.target === modal && !drawing) closeModal(); return; }
  const href = t.tagName === 'A' ? t.getAttribute('href') : null;
  if (href && href.startsWith('#') && href !== '#all-reset') { e.preventDefault(); go(href); return; }
  /* 질문 선택 */
  if (t.matches('.chip[data-q]')) {
    const q = t.dataset.q; const opt = QUESTIONS.find(x => x.key === q).options.find(o => String(o.v) === t.dataset.v);
    answers[q] = opt.v;
    t.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === t));
    if (q === 'h') updateFire(true);
    updateGo(); return;
  }
  if (t.id === 'goBtn') { onGo(); return; }
  if (t.id === 'resetBtn') { resetAnswers(); renderRecommend(); return; }
  if (t.id === 'againBtn') { go('#recommend'); return; }
  if (t.id === 'copyBtn') { copyLink(); return; }
  /* 거르기 · 정렬 */
  if (t.matches('.chip[data-f]')) {
    const k = t.dataset.f; const v = t.dataset.v === 'all' ? 'all' : (k === 's' || k === 't') ? t.dataset.v : Number(t.dataset.v);
    filters[k] = v; lastPick = null; renderAll();
    const again = app.querySelector(`.chip[data-f="${k}"][data-v="${t.dataset.v}"]`); if (again) again.focus({ preventScroll: true });
    return;
  }
  if (t.matches('.chip[data-sort]')) { sortKey = t.dataset.sort; renderAll(); const again = app.querySelector(`.chip[data-sort="${sortKey}"]`); if (again) again.focus({ preventScroll: true }); return; }
  if (t.id === 'resetF' || t.getAttribute('href') === '#all-reset') { e.preventDefault(); Object.keys(filters).forEach(k => { filters[k] = 'all'; }); lastPick = null; renderAll(); return; }
  if (t.id === 'diceBtn') { draw(); return; }
  /* 카드 · 창 */
  const act = t.dataset.act;
  if (act === 'wish') { toggleWish(t.closest('.kcard').dataset.id, t); return; }
  if (act === 'wish-plain') { toggleWish(t.dataset.id, null); const on = isWished(t.dataset.id); t.setAttribute('aria-pressed', on); t.textContent = on ? '♥ 찜함' : '♡ 찜하기'; return; }
  if (act === 'cmp') { toggleCompare(t.closest('.kcard').dataset.id); return; }
  if (act === 'clear') { compare = []; refreshCompareUI(); toast('비교를 비웠어요'); return; }
  if (act === 'compare') { if (compare.length === 2) go(`#compare?a=${compare[0]}&b=${compare[1]}`); return; }
  if (act === 'rm') { compare = compare.filter(x => x !== t.dataset.id); go('#all'); toast('비교에서 뺐어요. 하나 더 골라 주세요'); return; }
  if (act === 'redraw') { draw(); return; }
  if (act === 'close') { closeModal(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden && !drawing) closeModal(); });

/* 다른 탭에서 찜을 바꾸면 맞추기 */
const syncWish = () => {
  const before = JSON.stringify(wish); loadWish();
  if (JSON.stringify(wish) !== before) {
    updateWishCount();
    document.querySelectorAll('.kcard').forEach(c => { const h = c.querySelector('.heart'); if (h) { const on = isWished(c.dataset.id); h.setAttribute('aria-pressed', on); h.textContent = on ? '♥' : '♡'; } });
    if (parseHash().name === 'wish') renderWish();
  }
};
document.addEventListener('toggle', e => { if (e.target && e.target.id === 'fbox') filtersOpen = e.target.open; }, true);
window.addEventListener('storage', e => { if (e.key === WISH_KEY) syncWish(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncWish(); });
window.addEventListener('hashchange', () => { if (location.hash !== navHash) { navHash = location.hash; route(); } });

/* 시작: 시작 화면 없이 바로 */
loadWish(); updateWishCount(); route();
window.__tteokpickApp = { KITS, score, recommend, nickname, filtered, filters, get wish() { return wish; } };
})();
</script>
</body>
</html>
